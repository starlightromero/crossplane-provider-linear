# Vulnerability scanning pipeline for provider-linear
# All actions are SHA-pinned to immutable commits to prevent supply chain attacks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: "1.26"
  IMAGE_NAME: ghcr.io/starlightromero/provider-linear

jobs:
  # ---------------------------------------------------------------------------
  # Unit + property-based tests
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit and Property Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit and property-based tests
        run: >-
          go test -race -count=1 -coverprofile=coverage.out
          ./internal/validation/...
          ./internal/auth/...
          ./internal/immutable/...
          ./internal/reconciler/...
          ./config/externalname/...

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Verify generated code is up to date
  # ---------------------------------------------------------------------------
  generate-check:
    name: Generation Freshness Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install tools
        run: go install golang.org/x/tools/cmd/goimports

      - name: Run code generation
        run: go generate ./...

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code -- apis/ internal/controller/ package/crds/; then
            echo "::error::Generated code is out of date. Run 'go generate ./...' and commit the result."
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard -- apis/ internal/controller/ package/crds/)" ]; then
            echo "::error::Generated code added new files. Run 'go generate ./...' and commit the result."
            git ls-files --others --exclude-standard -- apis/ internal/controller/ package/crds/
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Integration tests
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run integration tests
        run: go test -race -count=1 -tags=integration ./test/integration/...

  # ---------------------------------------------------------------------------
  # Trivy filesystem scan — dependencies + IaC + secrets
  # ---------------------------------------------------------------------------
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run Trivy filesystem scan (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif

      - name: Upload Trivy FS results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      - name: Fail on critical/high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  # ---------------------------------------------------------------------------
  # Trivy container image scan
  # ---------------------------------------------------------------------------
  trivy-image:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build container image
        run: docker build -t ${{ env.IMAGE_NAME }}:scan .

      - name: Run Trivy image scan (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: sarif
          output: trivy-image-results.sarif
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Upload Trivy image results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      # Image severity gate disabled — the bundled terraform binary and
      # provider plugin contain third-party CVEs we cannot fix.
      # The filesystem scan (trivy-fs job) gates on our own code.
      # Re-enable after CLI-3755 removes these binaries.
      # - name: Fail on critical/high vulnerabilities
      #   uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      #   with:
      #     scan-type: image
      #     image-ref: ${{ env.IMAGE_NAME }}:scan
      #     severity: CRITICAL,HIGH
      #     exit-code: "1"
      #     format: table

  # ---------------------------------------------------------------------------
  # SBOM generation
  # ---------------------------------------------------------------------------
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # CodeQL static analysis
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go
          build-mode: manual

      - name: Build
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: codeql-go
